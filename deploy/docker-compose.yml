# Stack desplegado en AWS EC2:
#   nginx (puerto 80) -> app (3000)            http://<IP>/
#                     -> openobserve (5080)    http://<IP>/openobserve/
#   app --OTLP--> otel-collector --OTLP/HTTP--> openobserve
#   otel-collector (hostmetrics) -> CPU, RAM, red, disco de la instancia
#   temperature -> sensores térmicos del host -> openobserve
name: devops

services:
  app:
    image: ${APP_IMAGE:-app-devops-api:local}
    container_name: devops-app
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-dev}
      DB_PATH: /app/data/database.db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@uteq.mx}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      JWT_SECRET: ${JWT_SECRET:-uteq-devops-secret}
      OTEL_SERVICE_NAME: app-devops-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - app-data:/app/data
    ports:
      - "6061:6061"
    depends_on:
      - otel-collector

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: devops-openobserve
    restart: always
    environment:
      ZO_ROOT_USER_EMAIL: ${O2_USER}
      ZO_ROOT_USER_PASSWORD: ${O2_PASSWORD}
      ZO_DATA_DIR: /data
      ZO_BASE_URI: /openobserve
      ZO_TELEMETRY: "false"
      # Permite que las alertas lleguen al webhook interno de la app
      ZO_SSRF_ALLOWED_HOSTS: app
    volumes:
      - o2-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: devops-otel-collector
    restart: always
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0:0"
    environment:
      O2_AUTH: ${O2_AUTH}
      HOST_NAME: ${HOST_NAME:-ec2-devops}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
    depends_on:
      - openobserve

  temperature:
    image: alpine:3.20
    container_name: devops-temperature
    restart: always
    environment:
      O2_AUTH: ${O2_AUTH}
      HOST_NAME: ${HOST_NAME:-ec2-devops}
    volumes:
      - ./temperature.sh:/temperature.sh:ro
      - /sys:/host-sys:ro
    command: ["sh", "/temperature.sh"]
    depends_on:
      - openobserve

  nginx:
    image: nginx:1.27-alpine
    container_name: devops-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - openobserve

volumes:
  app-data:
  o2-data:
