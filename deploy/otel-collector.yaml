receivers:
  # Telemetría de la aplicación (logs, métricas y trazas vía OTLP)
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  # Recursos de infraestructura de la instancia EC2
  host_metrics:
    collection_interval: 15s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      load: {}
      network: {}
      disk: {}
      filesystem:
        exclude_mount_points:
          mount_points: ["/dev/*", "/proc/*", "/sys/*", "/run/*", "/snap/*", "/var/lib/docker/*"]
          match_type: regexp
      paging: {}
      processes: {}

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
  resource/host:
    attributes:
      - key: host.name
        value: ${env:HOST_NAME}
        action: upsert

exporters:
  otlp_http/openobserve:
    endpoint: http://openobserve:5080/openobserve/api/default
    headers:
      Authorization: Basic ${env:O2_AUTH}
      stream-name: default
  otlp_http/openobserve-logs:
    endpoint: http://openobserve:5080/openobserve/api/default
    headers:
      Authorization: Basic ${env:O2_AUTH}
      stream-name: app_logs

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/openobserve]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/openobserve]
    metrics/host:
      receivers: [host_metrics]
      processors: [memory_limiter, resource/host, batch]
      exporters: [otlp_http/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/openobserve-logs]
